<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetHome Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">Gestion réseau</p>
      <h1>NetHome Manager</h1>
    </div>
    <div class="hero-actions">
      <button id="exportData" class="secondary">Exporter JSON</button>
      <label class="secondary file-button">Importer JSON<input id="importData" type="file" accept="application/json"></label>
      <button id="exportXlsx" class="secondary">Exporter XLSX</button>
      <label class="secondary file-button">Importer XLSX<input id="importXlsx" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></label>
      <select id="themeSelect" class="theme-select" aria-label="Choisir un thème"><option value="ocean">Océan classique</option><option value="ocean-deep">Océan profond</option><option value="ocean-lagoon">Océan lagon</option><option value="ocean-night">Océan nuit</option><option value="dark">Thème sombre</option><option value="light">Thème clair</option><option value="midnight">Thème nuit</option><option value="forest">Thème forêt</option><option value="slate">Thème ardoise</option><option value="sunset">Thème coucher de soleil</option><option value="highcontrast">Contraste élevé</option></select>
      <button id="openNetworkModal">+ Réseau</button>
      <button id="openDeviceModal">+ Appareil</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel inventory-panel">
      <div class="toolbar">
        <div class="toolbar-title">
          <h2>Inventaire</h2>
          <p>Filtrez et triez votre inventaire.</p>
          <div class="view-switch" aria-label="Mode d’affichage">
            <button id="tileView" class="view-toggle active">Tuiles</button>
            <button id="listView" class="view-toggle">Liste</button>
          </div>
        </div>
        <div class="toolbar-controls">
          <input id="searchInput" type="search" placeholder="Rechercher nom, IP, MAC, notes...">
          <select id="networkFilter"><option value="all">Tous les réseaux</option></select>
          <select id="typeFilter"><option value="all">Tous les types</option></select>
          <select id="sortSelect"><option value="name">Tri: nom</option><option value="ip">Tri: adresse IP</option><option value="type">Tri: type</option><option value="network">Tri: réseau</option><option value="status">Tri: statut</option></select>
        </div>
      </div>
      <div id="inventory" class="cards"></div>
    </section>
  </main>

    <dialog id="networkDialog" class="modal"><section class="panel form-panel" aria-labelledby="network-form-title">
      <h2 id="network-form-title">Ajouter / éditer un réseau</h2>
      <form id="networkForm" class="stacked-form">
        <input type="hidden" id="networkId">
        <label>Nom du réseau<input id="networkName" required placeholder="LAN Maison"></label>
        <label>CIDR / plage IP<input id="networkCidr" required placeholder="192.168.1.0/24"></label>
        <label>Usage / zone<input id="networkZone" placeholder="Production, Invités, IoT..."></label>
        <label>Notes<textarea id="networkNotes" rows="3" placeholder="Routeur, DHCP, contraintes..."></textarea></label>
        <div class="form-actions">
          <button type="submit">Enregistrer le réseau</button>
          <button type="button" id="resetNetwork" class="secondary">Réinitialiser</button>
          <button type="button" id="closeNetworkModal" class="secondary">Fermer</button>
        </div>
      </form>
    </section></dialog>

  <dialog id="deviceDialog" class="modal"><section class="panel form-panel" aria-labelledby="device-form-title">
      <h2 id="device-form-title">Ajouter / éditer un périphérique</h2>
      <form id="deviceForm" class="stacked-form">
        <input type="hidden" id="deviceId">
        <label>Réseau<select id="deviceNetwork" required></select></label>
        <label>Nom<input id="deviceName" required placeholder="NAS, Switch bureau..."></label>
        <label>Type<select id="deviceType"><option>Serveur</option><option>Routeur</option><option>Switch</option><option>Point d'accès</option><option>Proxmox VE</option><option>Caméra LAN</option><option>Machine virtuelle</option><option>Shelly</option><option>Gateway</option><option>Ordinateur</option><option>Mobile</option><option>IoT</option><option>Imprimante</option><option>Autre</option></select></label>
        <div class="two-cols">
          <label>Adresse IP<input id="deviceIp" inputmode="numeric" maxlength="15" pattern="^(25[0-5]|2[0-4]\d|1?\d?\d)(\.(25[0-5]|2[0-4]\d|1?\d?\d)){3}$" placeholder="192.168.1.10"></label>
          <label>Adresse MAC<input id="deviceMac" maxlength="17" pattern="^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$" placeholder="AA:BB:CC:DD:EE:FF"></label>
        </div>
        <div class="two-cols">
          <label>Statut<select id="deviceStatus"><option>Actif</option><option>À vérifier</option><option>Éteint</option><option>Réservé</option></select></label>
          <label>Emplacement<input id="deviceLocation" placeholder="Baie, salon, bureau..."></label>
        </div>
        <div class="two-cols">
          <label>Login<input id="deviceLogin" autocomplete="off" placeholder="admin, root..."></label>
          <label>Mot de passe en clair<input id="devicePassword" type="text" autocomplete="off" placeholder="Mot de passe visible"></label>
        </div>
        <label>Mode IP<select id="deviceIpMode"><option value="none">Non défini</option><option value="fixed">IP Fixe</option><option value="dhcp">DHCP</option><option value="reservation">Statique (Réservation DHCP)</option></select></label>
        <label>URL de gestion<input id="deviceUrl" type="url" placeholder="https://192.168.1.1"></label>
        <label>Notes<textarea id="deviceNotes" rows="3" placeholder="Ports, services, mots-clés..."></textarea></label>
        <div class="form-actions">
          <button type="submit">Enregistrer le périphérique</button>
          <button type="button" id="resetDevice" class="secondary">Réinitialiser</button>
          <button type="button" id="closeDeviceModal" class="secondary">Fermer</button>
        </div>
      </form>
    </section></dialog>

  <dialog id="deviceDetailsDialog" class="modal"><section class="panel form-panel details-panel" aria-labelledby="device-details-title">
    <div class="details-header">
      <h2 id="device-details-title">Fiche périphérique</h2>
      <button type="button" id="closeDetailsModal" class="secondary">Fermer</button>
    </div>
    <div id="deviceDetails" class="details-grid"></div>
  </section></dialog>

  <template id="emptyStateTemplate"><div class="empty-state">Aucun élément à afficher. Ajoutez un réseau puis des périphériques.</div></template>
  <script src="app.js"></script>
</body>
</html>
